<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nat Barros Lab | Apps & Creative Tech</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px 24px; max-width: 520px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 2rem; margin-bottom: 8px; color: #38bdf8; letter-spacing: -0.5px; }
    p.tagline { color: #94a3b8; font-size: 1rem; margin-bottom: 24px; }
    p.description { color: #cbd5e1; line-height: 1.6; margin-bottom: 32px; font-size: 0.95rem; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn { background-color: #38bdf8; color: #0f172a; font-weight: 600; padding: 12px 20px; border-radius: 8px; text-decoration: none; transition: 0.2s; }
    a.btn:hover { background-color: #7dd3fc; }
    a.btn-secondary { background-color: transparent; border: 1px solid #475569; color: #e2e8f0; }
    a.btn-secondary:hover { background-color: #334155; }
    footer { margin-top: 32px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nat Barros Lab</h1>
    <p class="tagline">Publicidade, Design & Desenvolvimento Mobile</p>
    <p class="description">
      Desenvolvendo aplicativos móveis focados em experiência do usuário, design moderno e tecnologia.
    </p>
    <div class="links">
      <a href="mailto:seuemail@exemplo.com" class="btn">Entrar em contato</a>
      <!-- Quando tiver a política de privacidade, pode apontar para /privacidade.html -->
    </div>
  </div>
  <footer>
    &copy; 2026 Nat Barros Lab. Todos os direitos reservados.
  </footer>
</body>
</html>
